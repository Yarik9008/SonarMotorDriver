; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ПРОШИВКА И ИМИТАТОР — ОДИН ПРОЕКТ, ДВА ОКРУЖЕНИЯ
;
;   pio run            — боевая прошивка (env:hw, по умолчанию)
;   pio run -e sim     — имитатор: тот же протокол без энкодера и драйвера
;   pio run -e hw -e sim  — оба образа сразу (так собирается Release/)
;
; Собственные библиотеки проекта лежат в lib/ и подхватываются PlatformIO
; автоматически (sonar_proto — слой командного протокола, tmc2209 — драйвер).
;
; Логика у них общая целиком: main.c, ПИД, профиль движения, скан,
; синхронизация, телеметрия и парсер команд собираются из одних и тех же
; исходников — условий компиляции внутри логики нет. Различие ровно одно:
; какой слой железа попадает в сборку (build_src_filter):
;   env:hw  — src/biss_c.c (энкодер BiSS-C) + библиотека lib/tmc2209 (драйвер);
;   env:sim — src/sim_backend.c: виртуальный энкодер и виртуальный мотор.
; Поэтому имитатор отвечает по UART ровно как плата, а расхождение поведения
; двух прошивок (раньше это были две отдельные копии логики) исключено.

[platformio]
default_envs = hw

[env]
platform  = ststm32
board     = genericSTM32F103C8
framework = stm32cube

board_build.stm32cube.custom_config_header = yes

build_flags =
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -Wl,-u,_printf_float

; Строгие предупреждения включены только для кода проекта: build_src_flags,
; в отличие от build_flags, не распространяется на исходники STM32Cube HAL —
; там предупреждений много, и правка чужого фреймворка в задачи не входит.
; Для общих библиотек те же флаги заданы в их library.json (build.flags).
build_src_flags =
    -Wall
    -Wextra

; WCH-LinkW (беспроводной загрузчик): CMSIS-DAP с VID/PID WCH
; Используется кастомный openocd/wch-link.cfg (cmsis_dap_vid_pid должен быть
; выполнен в контексте adapter driver, поэтому не через -c)
upload_protocol = custom
; Путь только с "/" — иначе \b и \f в пути Windows ломают команду program
upload_command = openocd -f openocd/wch-link.cfg -f target/stm32f1x.cfg -c "program .pio/build/$PIOENV/firmware.bin 0x08000000 verify reset" -c "shutdown"

; ---------------------------------------------------------------------------
; Боевая прошивка: энкодер LENZ IRS по BiSS-C и драйвер TMC2209
; ---------------------------------------------------------------------------
[env:hw]
build_flags =
    ${env.build_flags}
    -DFW_VERSION=\"1.0.0\"
    ; фасад мотора из lib/tmc2209 (tmc2209_motor.c) компилируется только по
    ; этому флагу: он привязан к board.h прошивки, и прошивке без фасада
    ; (тестовый стенд) не приходится объявлять чужие макросы ради сборки
    -DTMC2209_USE_MOTOR_FACADE

; Модель железа имитатора в боевой образ не попадает
build_src_filter = +<*> -<sim_backend.c>

; lib_deps не нужен: обе библиотеки лежат в lib/ этого проекта и подключаются
; по #include в исходниках. Внешних зависимостей у прошивки нет — сборка не
; ходит в реестр PlatformIO и воспроизводится из одного каталога.

; ---------------------------------------------------------------------------
; Имитатор: тот же протокол без реального энкодера и драйвера
; ---------------------------------------------------------------------------
[env:sim]
build_flags =
    ${env.build_flags}
    ; версия отличается суффиксом — по строке boot:rst=... fw=... хост сразу
    ; видит, с имитатором он говорит или с боевой прошивкой
    -DFW_VERSION=\"1.0.0-sim\"
    -DBUILD_SIM=1
    ; заголовки драйвера нужны main.c для типов и прототипов фасада, а сами
    ; исходники библиотеки в имитатор не компилируются: их реализует
    ; src/sim_backend.c (иначе получили бы дублирование символов)
    -I lib/tmc2209/include

; Драйвер энкодера заменяется моделью вала
build_src_filter = +<*> -<biss_c.c>

; lib_ignore убирает библиотеку драйвера из сборки целиком: иначе LDF нашёл бы
; её по #include в main.c и собрал, а её символы столкнулись бы с моделью из
; sim_backend.c. Заголовки при этом подключаются флагом -I выше.
lib_ignore = tmc2209
