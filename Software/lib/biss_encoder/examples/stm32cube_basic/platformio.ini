; BiSS-C encoder example — STM32Cube HAL (blocking read)

[env:stm32f103c8]
platform  = ststm32
board     = genericSTM32F103C8
framework = stm32cube

lib_extra_dirs = ../..
lib_deps =
    file://../../

board_build.stm32cube.custom_config_header = yes

build_flags =
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -Wl,-u,_printf_float
