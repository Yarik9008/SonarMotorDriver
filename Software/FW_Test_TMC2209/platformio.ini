; PlatformIO Project Configuration File — Test_TMC2209
;
; Плата: STM32F103C8 (Blue Pill). Тестовая прошивка драйвера TMC2209:
; UART CLI по USART1, обмен с TMC2209 по USART2 (PDN_UART).
;
; https://docs.platformio.org/page/projectconf.html

[env:stm32f103c8]
platform  = ststm32
board     = genericSTM32F103C8
framework = stm32cube

; Своя копия stm32f1xx_hal_conf.h (include/stm32f1xx_hal_conf.h) вместо общего
; файла в каталоге пакета framework-stm32cubef1: пакет один на все прошивки, и
; сборка проекта со своим заголовком общий файл оттуда УДАЛЯЕТ, а сборка без
; него — создаёт его там заново из шаблона. Пока свой заголовок был не у всех
; прошивок, порядок сборок решал, соберётся ли проект вообще («Implicit
; dependency stm32f1xx_hal_conf.h not found»). Теперь он есть у каждой, и
; сборки не мешают друг другу.
board_build.stm32cube.custom_config_header = yes

build_flags =
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -Wl,-u,_printf_float        ; поддержка %f в printf (вывод rsense в команде diag)
    -I include

; Строгие предупреждения включены только для кода проекта: build_src_flags,
; в отличие от build_flags, не распространяется на исходники STM32Cube HAL —
; там предупреждений много, и правка чужого фреймворка в задачи не входит.
; Для общих библиотек те же флаги заданы в их library.json (build.flags).
build_src_flags =
    -Wall
    -Wextra

; Драйвер TMC2209 вынесен в Software/lib/tmc2209 — одна копия на тестовый стенд
; и основную прошивку, чтобы правки не приходилось дублировать.
; Источник зависимости указан явно ссылкой на каталог: по короткому имени
; "tmc2209" PlatformIO, не найдя локальный каталог (например, в сборочном
; образе, куда скопировали только каталог прошивки), молча пошёл бы за пакетом
; с таким именем в публичный реестр и мог собрать чужой код. С symlink:// он в
; таком случае сразу падает с ошибкой, а правки в библиотеке видны без
; копирования в .pio/libdeps.
lib_deps = symlink://../lib/tmc2209

; Прошивка через WCH-Link (CMSIS-DAP / SWD) + OpenOCD
upload_protocol = custom
upload_command  = openocd -f openocd/wch-link.cfg -f target/stm32f1x.cfg -c "program .pio/build/$PIOENV/firmware.bin 0x08000000 verify reset" -c "shutdown"
