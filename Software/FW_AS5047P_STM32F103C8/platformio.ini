; PlatformIO Project Configuration File
;
; Тестовая прошивка опроса энкодера AS5047P по SPI.
; Плата МК: WeAct Studio STM32F1 Core Board (STM32F103C8T6, HSE 8 МГц).
;
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube

; Своя копия stm32f1xx_hal_conf.h (include/stm32f1xx_hal_conf.h) вместо общего
; файла в каталоге пакета framework-stm32cubef1: пакет один на все прошивки, и
; сборка проекта со своим заголовком общий файл оттуда УДАЛЯЕТ, а сборка без
; него — создаёт его там заново из шаблона. Пока свой заголовок был не у всех
; прошивок, порядок сборок решал, соберётся ли проект вообще («Implicit
; dependency stm32f1xx_hal_conf.h not found»). Теперь он есть у каждой, и
; сборки не мешают друг другу.
board_build.stm32cube.custom_config_header = yes

build_flags =
    ; newlib-nano: компактный printf (без float — угол печатается целочисленно)
    --specs=nano.specs
    ; частота внешнего кварца на плате (значение по умолчанию HAL, задано явно)
    -D HSE_VALUE=8000000U
    ; канал лога: 0 = USB CDC (разъём USB-C платы), 1 = USART1 (PA9, 115200)
    -D LOG_USE_UART=0
    ; --- фильтр угла (следящий наблюдатель 2-го порядка, см. angle_filter.h) ---
    ; частота опроса датчика (такт TIM2); должна делить 1 МГц нацело
    -D SAMPLE_RATE_HZ=2000U
    ; полоса контура: уже — сильнее давит шум, хуже ловит ускорение.
    ; 10 Гц на модели: 0.0135° СКО против 0.0316° при 50 Гц (см. README, таблица).
    ; Потолок на 2 кГц — 63.66 Гц (wn*Ts <= 0.2).
    -D FILTER_BW_HZ=10.0f
    ; демпфирование: 1.0 = критическое (полюса вещественные, колебаний нет)
    -D FILTER_DAMPING=1.0f
    ; лог: 1 = Arduino Serial Plotter (raw/flt/w), 0 = текстовая диагностика
    -D LOG_PLOT=1

; Строгие предупреждения — только для кода проекта: в build_flags они попадали
; и на исходники STM32Cube HAL и USB-стека ST, где дают семь предупреждений
; о неиспользуемых параметрах и лишь мешают увидеть свои.
build_src_flags =
    -Wall
    -Wextra

; скорость нужна только для варианта LOG_USE_UART=1;
; у виртуального COM-порта она игнорируется
monitor_speed = 115200

; Прошивка/отладка через WCH-Link в ARM-режиме: он представляется как CMSIS-DAP
; (VID:PID 1A86:8012), работает через OpenOCD.
; ВАЖНО: WCH-Link по умолчанию в RISC-V режиме (1A86:8010). Переключение в ARM —
; кнопкой ModeS при подключении или утилитой WCH-LinkUtility.
; SWD: DIO -> PA13, CLK -> PA14, плюс GND и 3V3.
;
; Альтернативы: upload_protocol = stlink (ST-Link V2)
;               upload_protocol = serial (BOOT0 = 1 + USB-UART на PA9/PA10)
upload_protocol = stlink
debug_tool = stlink
